services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aca-tables-demo-app
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - TABLE_NAME=demotable
      - AZURE_TABLES_CONNECTION_STRING=DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;TableEndpoint=http://azurite:10002/devstoreaccount1;
    depends_on:
      azurite:
        condition: service_healthy
    restart: unless-stopped

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: aca-tables-demo-azurite
    command: "azurite -l /data --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0"
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite_data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 10002 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  azurite_data:
